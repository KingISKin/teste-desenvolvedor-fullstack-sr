; Application overrides on top of php.ini-production.
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Must accept the 20 MB CSV limit enforced by the API (plus multipart overhead).
upload_max_filesize = 21M
post_max_size = 22M

; Code is immutable inside the image: never re-check files on disk.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
