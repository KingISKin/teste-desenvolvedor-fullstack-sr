[www]
; Used by the container healthcheck (cgi-fcgi ... /ping -> "pong").
ping.path = /ping

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Health probes would otherwise flood the access log.
access.suppress_path[] = /ping
